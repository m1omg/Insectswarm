name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install step: the project has no dependencies, by design.
      - name: Check SCIENCE.md is in step with the simulation
        run: node tools/build-science.js --check
      - name: Unit and behavioural tests
        run: node --test test/*.test.js

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The repository is the site — there is nothing to build.
      #
      # Pages has to be switched on by hand once, in Settings → Pages → Source: "GitHub Actions".
      # This job cannot do it for you: the workflow's GITHUB_TOKEN is allowed to *deploy* to Pages
      # but not to *create* the Pages site, so asking it to (`enablement: true`) fails with
      # "Resource not accessible by integration". Every deploy after that one-time toggle is
      # automatic.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
