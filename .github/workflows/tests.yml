name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install step: the project has no dependencies, by design.
      - name: Check SCIENCE.md is in step with the simulation
        run: node tools/build-science.js --check
      - name: Unit and behavioural tests
        run: node --test test/*.test.js

# Publishing is not done from here.
#
# There is no build step — the repository is the site — so GitHub Pages serves `main` directly
# under Settings → Pages → Source: "Deploy from a branch", branch `main`, folder `/ (root)`.
# GitHub's own builder then publishes every push. That is a repository setting; until someone
# applies it, the site is not published at all, however green this workflow is.
#
# There used to be a deploy job here using actions/deploy-pages, and it failed on every push to
# `main` — about a second each, no runner, no steps, no logs. The reason was the `github-pages`
# environment, which only accepts deployments from the repository's default branch; that default
# branch was never moved off the original feature branch, so deployments from `main` were refused
# before they began. Deploying from Actions would mean fixing the default branch and switching the
# Pages source, which for a repository that needs no building buys nothing over serving the branch.
